name: terraform apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 17 * * 1" # Monday 9am PT / 17:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: branch to run against
        required: false
        default: main
      command:
        description: command to run
        required: false
        default: plan
        type: choice
        options:
          - plan
          - apply
      workspaces:
        description: comma separated workspace paths or "all" (e.g. "terraform/github,terraform/cloudflare")
        required: false
        default: all

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect-changes.outputs.matrix }}
      has_changes: ${{ steps.detect-changes.outputs.has_changes }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: detect changes
        id: detect-changes
        run: .github/scripts/detect-changes.sh
        env:
          BASE_REF: ${{ github.event.before || 'HEAD~1' }}
          ALL_WORKSPACES: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.workspaces == 'all')) && 'true' || 'false' }}
          FILTER: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.workspaces != 'all') && github.event.inputs.workspaces || '' }}

  run:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    concurrency:
      group: terraform-apply-${{ matrix.workspace.path }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install terraform
        uses: hashicorp/setup-terraform@v3.1.2
      - name: setup aws
        run: .github/scripts/setup-aws-profiles.sh
        env:
          AWS_ACCOUNT_IDS: ${{ secrets.AWS_ACCOUNT_IDS }}
      - name: terraform init
        run: terraform init -input=false
        working-directory: ${{ matrix.workspace.path }}
      - name: terraform plan
        run: terraform plan -input=false
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'plan'
        working-directory: ${{ matrix.workspace.path }}
      - name: terraform apply
        run: terraform apply -input=false -auto-approve
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.command == 'apply'
        working-directory: ${{ matrix.workspace.path }}
